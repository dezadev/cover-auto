<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Auto</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="card">
    <h1>Cover Auto</h1>
    <p>Generate template hardcover massal dari banyak PDF untuk workflow CorelDRAW 17.</p>
    <form action="/generate" method="post" enctype="multipart/form-data">
      <label>File PDF</label>
      <input type="file" name="files" accept="application/pdf" multiple required>

      <div class="grid">
        <label>Lebar punggung (mm)
          <input type="number" name="spine_width_mm" value="18" min="1" step="0.1">
        </label>
        <label>Gap punggung-cover depan (mm)
          <input type="number" name="gap_mm" value="5" min="0" step="0.1">
        </label>
        <label>Posisi kiri punggung (mm)
          <input type="number" name="spine_left_mm" value="57" min="0" step="0.1">
        </label>
        <label>Margin atas (mm)
          <input type="number" name="margin_top_mm" value="32" min="0" step="0.1">
        </label>
      </div>

      <button type="submit">Generate Cover</button>
    </form>
  </main>
</body>
</html>
